name: Demo - Emit Upgrade Proposal

on:
  workflow_dispatch: {}

jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run demo emitter
        run: |
          python scripts/demo_emit_upgrade_proposal.py
          ls -la _demo_outbox
          echo "--- DEMO JSON ---"
          cat _demo_outbox/*.json

      - name: Upload demo outbox artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-outbox
          path: _demo_outbox/*.json
