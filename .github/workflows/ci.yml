name: Adaptive Core Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (editable) + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Validate proposals inbox (fail-closed)
        run: |
          python -c "from adaptive_core.v3.proposals import validate_inbox; validate_inbox()"

      - name: Run tests (coverage enforced)
        run: |
          pytest
