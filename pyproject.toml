[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digibyte-quantum-adaptive-core"
version = "3.0.0"
description = "DigiByte Quantum Adaptive Core (v3) — deterministic upgrade oracle + guardrails registry."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "DarekDGB" }
]
keywords = ["DigiByte", "security", "adaptive", "defense", "wallet", "shield", "oracle", "governance", "upgrade"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
]

dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=adaptive_core --cov-report=term-missing --cov-fail-under=100"
